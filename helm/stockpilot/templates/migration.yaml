apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stockpilot.name" . }}-migrate-{{ .Values.backend.tag | trunc 12 | lower | replace "." "-" }}
  annotations:
    stockpilot.io/commit: {{ .Values.backend.tag | quote }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: stockpilot-migration, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: DATABASE_URL}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
