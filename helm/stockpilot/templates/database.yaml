apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.name" . }}-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: stockpilot-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stockpilot.name" . }}-postgres
spec:
  serviceName: {{ include "stockpilot.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: stockpilot-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stockpilot-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext: {runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true}
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: {{ .Values.database.existingSecret }}}}]
          env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
          resources:
{{ toYaml .Values.database.resources | indent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.database.storageClass }}
        storageClassName: {{ .Values.database.storageClass }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.database.storageSize }}}
