{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "stockpilot.name" . }}-backend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "stockpilot.name" . }}-backend}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}}}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stockpilot.name" . }}
  labels: {release: monitoring}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: stockpilot-backend, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
{{- end }}
