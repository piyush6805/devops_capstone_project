{{- $root := . -}}
{{- range $component := list "backend" "frontend" }}
{{- $config := index $root.Values $component }}
{{- $port := ternary 8000 8080 (eq $component "backend") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockpilot.name" $root }}-{{ $component }}
  labels: {app.kubernetes.io/name: stockpilot-{{ $component }}, app.kubernetes.io/instance: {{ $root.Release.Name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: stockpilot-{{ $component }}, app.kubernetes.io/instance: {{ $root.Release.Name }}}
  ports: [{name: http, port: {{ ternary 8000 80 (eq $component "backend") }}, targetPort: {{ $port }}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockpilot.name" $root }}-{{ $component }}
spec:
  {{- if or (ne $component "backend") (not $root.Values.hpa.enabled) }}
  replicas: {{ $config.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: stockpilot-{{ $component }}, app.kubernetes.io/instance: {{ $root.Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stockpilot-{{ $component }}, app.kubernetes.io/instance: {{ $root.Release.Name }}}
      annotations: {stockpilot.io/commit: {{ $config.tag | quote }}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ ternary 10001 101 (eq $component "backend") }}
        runAsGroup: {{ ternary 10001 101 (eq $component "backend") }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if eq $component "backend" }}
      initContainers:
        - name: wait-schema
          image: "{{ $config.image }}:{{ $config.tag }}"
          imagePullPolicy: {{ $config.pullPolicy }}
          command: [python, -m, app.wait_schema]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $root.Values.database.existingSecret }}, key: DATABASE_URL}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ $config.image }}:{{ $config.tag }}"
          imagePullPolicy: {{ $config.pullPolicy }}
          ports: [{name: http, containerPort: {{ $port }}}]
          env:
            {{- if eq $component "backend" }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $root.Values.database.existingSecret }}, key: DATABASE_URL}}
            - name: APP_VERSION
              value: {{ $config.tag | quote }}
            {{- else }}
            - name: BACKEND_UPSTREAM
              value: {{ printf "%s-backend:8000" (include "stockpilot.name" $root) | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: {{ ternary "/ready" "/nginx-health" (eq $component "backend") }}, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: {{ ternary "/health" "/nginx-health" (eq $component "backend") }}, port: http}
            initialDelaySeconds: 20
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
{{ toYaml $config.resources | indent 12 }}
{{- end }}
