name: stockpilot
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: stockpilot-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://stockpilot:${POSTGRES_PASSWORD:-stockpilot-local-only}@postgres:5432/stockpilot
      APP_VERSION: ${APP_VERSION:-local}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 7s
      retries: 20
  frontend:
    build: ./frontend
    image: stockpilot-frontend:local
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
