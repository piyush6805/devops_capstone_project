apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/piyush6805/devops_capstone_project.git
    targetRevision: main
    path: helm/stockpilot
    helm:
      releaseName: stockpilot
      valueFiles:
        - values-aws.yaml
        - values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  revisionHistoryLimit: 5
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: stockpilot-backend
      namespace: stockpilot
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
